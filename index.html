<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>landing</title>
    <!-- Referencia a TailwindCSS 4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Main con fondo claro y soporte para modo oscuro -->
    <main class="bg-slate-50 dark:bg-gray-900">
      
      <!-- Contenedor 01 con espaciado y texto centrado -->
      <div id="container-01" class="mx-auto px-4 py-20 text-center">
        
        <!-- H1 con tipografía de alto impacto -->
        <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">
          Tu presencia digital comienza aquí
        </h1>
        
        <!-- Párrafo con legibilidad optimizada -->
        <p class="mt-6 text-lg leading-relaxed text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
          Creamos experiencias web atractivas y rápidas con Tailwind CSS 4.1. 
          Dale vida a tus ideas con un diseño moderno y responsivo.
        </p>

        <!-- Contenedor 02: Flexbox con separación de 1rem (gap-4) -->
        <div id="container-02" class="mt-8 flex justify-center gap-4">
          
          <!-- Botón de acción principal -->
          <button id="start" class="inline-block px-6 py-3 text-white bg-blue-600 rounded-lg">
            Comenzar
          </button>
          
          <!-- Botón de demo con borde adaptable a modo oscuro -->
          <button id="demo" class="inline-block px-6 py-3 border border-gray-300 text-gray-700 rounded-lg dark:border-gray-600 dark:text-white">
            Ver demo
          </button>
        </div>

      </div>
    </main>
  </body>
</html>
